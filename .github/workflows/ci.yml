name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required open-source files
        run: |
          test -f LICENSE
          test -f README.md
          test -f docs/PRD.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
      - name: Check for accidental secret patterns
        run: |
          ! grep -rnE "(ghp_[A-Za-z0-9]{20,}|ops_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})" README* docs/ packages/ apps/ || exit 1

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
